[project]
name = "ine-data-trust-engine"
version = "2.0.0"
description = "Deterministic validation core for INE Data Trust"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "mcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "xlwt>=1.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
