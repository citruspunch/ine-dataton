[project]
name = "radar-territorial-gt"
version = "0.1.0"
description = "Territorial road-safety and health radar for Guatemala (INE Datatón 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
]

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
