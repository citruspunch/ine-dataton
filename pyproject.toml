[project]
name = "municipal-demand-profile"
version = "0.1.0"
description = "Municipal demand and economic activity profile (Census 2018 + DINESE 2021/2022/2024)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Datatón INE 2026 team" }]
dependencies = [
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pandas>=2.2",
]

[project.scripts]
municipal-profile = "municipal_profile.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/municipal_profile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
