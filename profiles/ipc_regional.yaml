profile_id: ipc_regional
version: "1.0.0"
kind: xlsx
topic: ipc
title: IPC por Región
description: >
  Segundo recurso real y segundo perfil declarativo, con una forma distinta:
  tabla ancha (una columna por región), hoja Hoja1, sin columna de variación
  publicada y con un rango de periodos en vez de dos meses sueltos. Se evalúa
  con el mismo motor, sin tocar código.

expected_sheet: Hoja1

columns:
  - key: year
    header: "Año"
    type: integer
    role: period_year

  - key: month
    header: "Mes"
    type: month_name
    role: period_month

  - key: republica
    header: "República"
    type: number
    role: index
    base: "2024=100"
    unit: índice

  - key: region_1
    header: "Región I"
    type: number
    role: index
    base: "2024=100"
    unit: índice

  - key: region_2
    header: "Región II"
    type: number
    role: index
    base: "2024=100"
    unit: índice

  - key: region_3
    header: "Región III"
    type: number
    role: index
    base: "2024=100"
    unit: índice

  - key: region_4
    header: "Región IV"
    type: number
    role: index
    base: "2024=100"
    unit: índice

  - key: region_5
    header: "Región V"
    type: number
    role: index
    base: "2024=100"
    unit: índice

  - key: region_6
    header: "Región VI"
    type: number
    role: index
    base: "2024=100"
    unit: índice

  - key: region_7
    header: "Región VII"
    type: number
    role: index
    base: "2024=100"
    unit: índice

  - key: region_8
    header: "Región VIII"
    type: number
    role: index
    base: "2024=100"
    unit: índice

grain: [year, month]
unit: índice

period:
  year_column: year
  month_column: month
  range:
    from: "2025-01"
    to: "2026-10"

series:
  - id: republica
    label: "República"
    index_column: republica
    comparable: true
  - id: region_1
    label: "Región I"
    index_column: region_1
    comparable: true
  - id: region_2
    label: "Región II"
    index_column: region_2
    comparable: true
  - id: region_3
    label: "Región III"
    index_column: region_3
    comparable: true
  - id: region_4
    label: "Región IV"
    index_column: region_4
    comparable: true
  - id: region_5
    label: "Región V"
    index_column: region_5
    comparable: true
  - id: region_6
    label: "Región VI"
    index_column: region_6
    comparable: true
  - id: region_7
    label: "Región VII"
    index_column: region_7
    comparable: true
  - id: region_8
    label: "Región VIII"
    index_column: region_8
    comparable: true

display:
  period: "enero 2025 a octubre 2026"
  base: "2024=100 en todas las columnas"
  unit: "índice"
