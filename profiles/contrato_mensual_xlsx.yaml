profile_id: contrato_mensual_xlsx
version: "1.1.0"
kind: xlsx
topic: sintetico
title: Contrato mensual (XLSX)
description: >
  El mismo contrato del perfil contrato_mensual, pero en un XLSX de una hoja
  llamada Datos. Añadir este perfil no requirió tocar el motor (FR-13).

expected_sheet: Datos

columns:
  - key: year
    header: anio
    type: integer
    role: period_year
  - key: month
    header: mes
    type: integer
    role: period_month
  - key: indicator
    header: indicador
    type: string
  - key: value
    header: valor
    type: number
    role: index
    base: "2025=100"
    unit: índice
  - key: unit
    header: unidad
    type: string

grain: [year, month, indicator]
unit: indice
unit_column: unit

period:
  year_column: year
  month_column: month
  expected:
    - "2025-01"
    - "2025-02"
    - "2025-03"

series:
  - id: valor
    label: "Serie mensual"
    index_column: value
    comparable: true

display:
  period: "enero a marzo de 2025"
  base: "2025=100 (serie sintética, no es una base oficial)"
  unit: "índice"
