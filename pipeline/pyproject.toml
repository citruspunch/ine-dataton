[project]
name = "ine-basket"
version = "1.0.0"
description = "Ingesta y normalización de la Canasta Básica Alimentaria (CBAU/CBAR) y del IPC del INE Guatemala"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "python-calamine>=0.3",
    "pyarrow>=17",
    "requests>=2.32",
]

[project.scripts]
basket-ingest = "ine_basket.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ine_basket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
