profile_id: ipc_regional_v1
version: "2.0.0"
kind: xlsx
topic: ipc
title: IPC por Región
description: >
  Contrato del XLSX oficial del IPC por Región, hoja Hoja1. La tabla tiene una
  columna por región, no incluye variación publicada y declara un rango de
  periodos. Se evalúa con el mismo motor que los demás perfiles.

expected_sheet: Hoja1
header_row: 1

schema:
  - name: year
    column: "Año"
    type: integer
    role: period_year
  - name: month
    column: "Mes"
    type: string
    role: period_month
  - name: republica
    column: "República"
    type: float
    unit: índice
    reference: "2024=100"
  - name: region_1
    column: "Región I"
    type: float
    unit: índice
    reference: "2024=100"
  - name: region_2
    column: "Región II"
    type: float
    unit: índice
    reference: "2024=100"
  - name: region_3
    column: "Región III"
    type: float
    unit: índice
    reference: "2024=100"
  - name: region_4
    column: "Región IV"
    type: float
    unit: índice
    reference: "2024=100"
  - name: region_5
    column: "Región V"
    type: float
    unit: índice
    reference: "2024=100"
  - name: region_6
    column: "Región VI"
    type: float
    unit: índice
    reference: "2024=100"
  - name: region_7
    column: "Región VII"
    type: float
    unit: índice
    reference: "2024=100"
  - name: region_8
    column: "Región VIII"
    type: float
    unit: índice
    reference: "2024=100"

types: [integer, float, string]

grain: [year, month]

dates:
  year: year
  month: month
  month_format: name_es
  range:
    from: "2025-01"
    to: "2026-10"

summary_notes: >
  Tabla ancha con una columna por territorio. Todas las columnas comparten la
  base 2024=100 y el resumen declara unidad, referencia y conteos por variable.

display:
  period: "enero 2025 a octubre 2026"
  base: "2024=100 en todas las columnas"
  unit: "índice"
