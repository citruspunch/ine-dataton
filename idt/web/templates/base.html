<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}INE Data Trust{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">INE Data Trust <span class="tag">prototipo</span></div>
    <nav>
      <a href="/review" class="{{ 'active' if active == 'review' else '' }}">Revisión técnica</a>
      <a href="/" class="{{ 'active' if active == 'public' else '' }}">Consulta</a>
    </nav>
  </div>
</header>

{% if msg %}<div class="flash {{ kind }}">{{ msg }}</div>{% endif %}

<main class="wrap">
{% block content %}{% endblock %}
</main>

<footer>
  <p>Validación técnica del prototipo. No certifica, no corrige, no publica en CKAN
  y no constituye aprobación del INE. Los datos conservan su licencia original.</p>
</footer>
</body>
</html>
